# NOTE: deploy
# docker node update --label-add postgresql=true `docker node inspect self --format "{{ .ID }}"`

services:
  postgresql:
    image: ghcr.io/zerocluster/postgresql/19
    init: true
    stop_grace_period: 5m

    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - "node.labels.postgresql == true"

    command: run

    secrets:
      - { source: postgresql_env.yaml, target: /var/local/package/env.yaml }

    networks: [network]

    volumes:
      - { type: tmpfs, target: /dev/shm, tmpfs: { size: 1073741824 } }
      - { type: volume, source: postgresql, target: /var/local/package/data }
      - { type: bind, source: /var/run/postgresql, target: /var/run/postgresql }

    build:
      args:
        POSTGRESQL_VERSION: 19
        POSTGIS_VERSION: 3
      secrets:
        - id=GITHUB_TOKEN,env=GITHUB_TOKEN

secrets:
  postgresql_env.yaml: { file: env.yaml }

networks:
  network: ~

volumes:
  postgresql: ~
