dependencies:
  - "@corejslib/app"

services:
  primary:
    components:
      postgresql:
        mode: primary

  standby-synchronous:
    components:
      postgresql:
        mode: standby-synchronous

  standby-asynchronous:
    components:
      postgresql:
        mode: standby-asynchronous

  backup:
    components:
      postgresql:
        mode: backup
      rpc: true

defaultService: primary

components:
  env:
    name: postgresql

  healthcheck:
    enabled: false

config: ~
